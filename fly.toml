# Fly.io config. First deploy:
#   fly launch --no-deploy --copy-config        (pick an app name; update `app` and ORIGIN below)
#   fly volumes create data --size 1 --region <region>
#   fly deploy
app = "ppsplitmedaddy"
primary_region = "sjc"

[build]

[env]
  ORIGIN = "https://ppsplitmedaddy.fly.dev"
  TZ = "America/Los_Angeles"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # SQLite + in-process cron: exactly one always-on machine
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
