name: Nightly database backup

# Dumps the Turso database to SQL, encrypts it, and keeps it as a workflow artifact for 90 days.
# Repo secrets: TURSO_API_TOKEN (`turso auth api-tokens mint gh-backup`), TURSO_DB_NAME, BACKUP_PASSWORD.
# Restore: gpg -d backup.sql.gpg > backup.sql && turso db create restored --from-dump backup.sql

on:
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install Turso CLI
        run: |
          curl -sSfL https://get.tur.so/install.sh | bash
          echo "$HOME/.turso" >> "$GITHUB_PATH"

      - name: Dump and encrypt
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          turso db shell "${{ secrets.TURSO_DB_NAME }}" .dump > backup.sql
          test -s backup.sql
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSWORD" -o backup.sql.gpg backup.sql
          rm backup.sql

      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup.sql.gpg
          retention-days: 90
