# Continuous SQLite backup. Only used when LITESTREAM_REPLICA_URL is set (see scripts/docker-entrypoint.sh).
# Receipts live on the volume and are NOT replicated by Litestream; back up /data/receipts separately
# (e.g. a periodic `rclone sync`) if you need off-machine copies.
dbs:
  - path: ${DATABASE_PATH}
    replicas:
      - url: ${LITESTREAM_REPLICA_URL}
        endpoint: ${LITESTREAM_ENDPOINT}
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
